[presencium]
; Valeurs proposees aux nouveaux equipements. Le delai de depart est le
; reglage qui compte : il separe le rebond d'une balise d'un vrai depart.
delai_depart = 15
delai_arrivee = 0
; Simulation globale : aucune action n'est executee nulle part, tout est
; journalise. De quoi laisser tourner quelques jours et relire.
simulation = 0
; Le journal garde toute une campagne de simulation : 200 entrees ne couvrent
; que deux jours sur une installation ordinaire, et une heure de rebonds en
; consomme une vingtaine. Un millier tient une dizaine de jours pour environ
; 250 ko par equipement.
journal_taille = 1000
; Au-dela de cette duree, une absence est tenue pour une vraie sortie ; en deca,
; pour un decrochage de la balise. Sert a l'analyse de la balise et au journal,
; qui signale les departs confirmes plus courts que ce seuil.
seuil_vrai = 60
; Silence au-dela duquel une balise qui se dit presente devient suspecte.
; Les balises Bluetooth battent regulierement tant qu'elles sont vues : un
; silence long trahit une pile morte ou une passerelle arretee. 0 desactive
; le controle.
silence_max = 120
